<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forest Clans - tests</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: monospace; background: #111; color: #eee; margin: 10px; align-items: flex-start; }
    #wrap { width: 960px; }
    .pass { color: #7ddc6a; }
    .fail { color: #ff6b5b; }
  </style>
</head>
<body>
  <!-- Open this file in a browser. It loads the game below and plays through it automatically.
       Each check starts with the requirement ID (from problem.md) that it tests. -->
  <h2 id="summary">Running tests...</h2>
  <ul id="results"></ul>

  <!-- Same game markup as index.html -->
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="hud" class="hidden">
      <div id="cat-info"></div>
      <div id="task"></div>
      <div id="clock"></div>
      <div id="territory"></div>
      <div id="orders" class="hidden"></div>
      <div id="scent" class="hidden"></div>
      <button id="new-cat">New cat</button>
      <div id="rogue-bar" class="bar hidden"><div class="fill"></div><span>Enemy</span></div>
      <div id="bars">
        <div id="health-bar" class="bar"><div class="fill"></div><span>Health</span></div>
        <div id="food-bar" class="bar"><div class="fill"></div><span>Food</span></div>
      </div>
    </div>
    <div id="fishing" class="hidden">
      <p id="fishing-text"></p>
      <div id="fish-water"><div id="fish-zone"></div><div id="fish"></div></div>
    </div>
    <div id="pouch" class="hidden">
      <h3>Herb pouch</h3>
      <p id="pouch-count"></p>
      <div id="pouch-list"></div>
    </div>
    <div id="map" class="hidden">
      <canvas id="map-canvas" width="360" height="360"></canvas>
      <ul id="map-legend"></ul>
    </div>
    <div id="mentor-choice" class="hidden">
      <h2>Choose your mentor</h2>
      <div id="mentor-options"></div>
    </div>
    <div id="role-choice" class="hidden">
      <h2>Choose your path</h2>
      <div id="role-options"></div>
    </div>
    <div id="message" class="hidden"></div>
    <div id="menu">
      <input id="name-input">
      <div id="fur-options"></div>
      <div id="eye-options"></div>
      <div id="pattern-options"></div>
      <div id="clan-options"></div>
      <canvas id="preview" width="260" height="200"></canvas>
      <p id="preview-name"></p>
      <button id="start-btn">Start</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
  <script src="render3d.js"></script>
  <script src="script.js"></script>

  <script>
    const results = [];

    // check("R7", "what is checked", () => true or false)
    function check(id, name, test) {
      let ok = false;
      let error = "";
      try { ok = !!test(); } catch (e) { error = " (error: " + e.message + ")"; }
      results.push({ name: `${id}: ${name}${error}`, ok });
    }

    // Run the game logic for some seconds (60 steps per second)
    function step(seconds) {
      for (let i = 0; i < Math.round(seconds * 60); i++) update(1 / 60);
    }
    function releaseAll() {
      for (const k in keys) keys[k] = false;
    }
    // Press a key for one frame and keep holding it until releaseAll()
    function tap(code) {
      pressed[code] = true;
      keys[code] = true;
      step(1 / 60);
    }
    // Press a key for one frame and let go
    function press(code) {
      tap(code);
      keys[code] = false;
    }
    function pressE() {
      press("KeyE");
    }
    function dist2d(a, b) {
      return Math.hypot(a.x - b.x, a.z - b.z);
    }
    // Put the player at (x, z) facing +z, standing still on the ground
    function place(x, z) {
      Object.assign(player, { x, z, y: 0, vy: 0, heading: 0, turnVel: 0, onGround: true, climbing: null,
                              running: false, dodgeTimer: 0, dodgeCooldown: 0, recover: 0, attackCooldown: 0,
                              biteCooldown: 0 });
    }
    // Positions measured from the player's own camp (always inside the player's territory)
    function at(dx, dz) {
      return { x: CAMP.x + dx, z: CAMP.z + dz };
    }
    function placeAt(dx, dz) {
      place(CAMP.x + dx, CAMP.z + dz);
    }
    // Remove small prey and the squirrel so they can't get in the way of a check
    function quiet() {
      prey.length = 0;
      squirrel.state = "hidden";
      squirrel.respawn = 9999;
    }
    // x of the water in the player's own territory: a spot in it, and a spot on its bank
    function waterX() {
      return CAMP.x > 0 ? (RIVER_X0 + RIVER_X1) / 2 : (STREAM_X0 + STREAM_X1) / 2;
    }
    function bankX() {
      return CAMP.x > 0 ? RIVER_X0 - 1 : STREAM_X0 - 1;
    }
    // Walk forward for some seconds with a clan, from an open spot; returns the distance
    function walkFor(clan, seconds, run) {
      clanName = clan;
      resetGame();
      playing = true;
      trees.length = 0;
      quiet();
      placeAt(0, -30);
      step(0.5); // so the last tap of an earlier check is long ago
      if (run) { press("KeyW"); step(0.05); tap("KeyW"); }
      keys.KeyW = true;
      const start = { x: player.x, z: player.z };
      step(seconds);
      releaseAll();
      return dist2d(player, start);
    }
    // A fresh game that has already reached the role choice
    function freshAtRoleChoice(clan) {
      clanName = clan || "ThunderClan";
      resetGame();
      playing = true;
      stage = 3;
      choosingRole = true;
      quiet();
    }
    // A fresh game as a full clan cat with a role (and optionally a mentor)
    function freshWithRole(r, clan, mentorId) {
      freshAtRoleChoice(clan);
      mentor = mentorId || null;
      chooseRole(r);
    }
    // A fresh game as an apprentice with a mentor
    function freshApprentice(mentorId, clan) {
      clanName = clan || "ThunderClan";
      resetGame();
      playing = true;
      stage = 2;
      quiet();
      if (mentorId) chooseMentor(mentorId);
    }
    // Climb a test tree for some seconds; returns the height reached
    function climbFor(clan, seconds) {
      clanName = clan;
      resetGame();
      playing = true;
      quiet();
      trees.length = 0;
      const spot = at(12, -30);
      trees.push({ x: spot.x, z: spot.z, r: 0.6, h: 12, kind: "oak", phase: 0 });
      place(spot.x, spot.z - 0.6 - 0.45);
      keys.KeyW = true;
      step(seconds);
      const height = player.y;
      releaseAll();
      return height;
    }
    // A test enemy that is fighting the player, standing right in front of it
    function enemyInFrontOfPlayer(gap) {
      Object.assign(rogue, { x: player.x, z: player.z + (gap || 1.2), hp: ROGUE_HP, state: "fighting",
                             windup: 0, cooldown: 5, stagger: 0 });
      return rogue;
    }
    // Stand still next to a fighting enemy and return how much health was lost
    function damageTakenNear(enemy, seconds) {
      const hp = player.hp;
      step(seconds);
      return hp - player.hp;
    }
    // A pixel on the map canvas, as [r, g, b]
    function mapPixel(x, z) {
      const p = mapToCanvas(x, z);
      return [...doc().getElementById("map-canvas").getContext("2d").getImageData(Math.round(p.x), Math.round(p.y), 1, 1).data].slice(0, 3);
    }
    function doc() { return document; }
    function colorClose(rgb, hex) {
      const n = parseInt(hex.slice(1), 16);
      const want = [n >> 16, (n >> 8) & 255, n & 255];
      return rgb.every((v, i) => Math.abs(v - want[i]) < 40);
    }

    window.addEventListener("load", () => {
      const doc = document;
      try {
        // ================= Initial requirements (R1-R5) =================
        // ---------- Menu ----------
        check("R1", "menu shows 6 fur colours", () => doc.querySelectorAll("#fur-options button").length === 6);
        check("R1", "menu shows 4 eye colours", () => doc.querySelectorAll("#eye-options button").length === 4);
        check("R1", "menu shows 3 patterns", () => doc.querySelectorAll("#pattern-options button").length === 3);
        check("R2", "menu shows 4 clans", () => doc.querySelectorAll("#clan-options button").length === 4);
        check("R3", "name is cleaned", () => cleanName("fIRE 9") === "Fire" && cleanName("") === "Fire");

        // Choose Black, Tabby, WindClan, name "storm"
        doc.querySelector("#fur-options button[title='Black']").click();
        doc.querySelectorAll("#pattern-options button")[1].click();
        doc.querySelectorAll("#clan-options button")[2].click();
        doc.getElementById("name-input").value = "storm";
        doc.getElementById("start-btn").click();

        check("R1", "game starts", () => playing === true);
        check("R1", "menu hidden after start", () => doc.getElementById("menu").classList.contains("hidden"));
        check("R3", "starts as a kit called Stormkit", () => fullName() === "Stormkit" && rankName() === "Kit");
        check("R1", "chosen look is used", () => look.fur === "#2e2b2b" && look.pattern === "Tabby");
        check("R2", "chosen clan is used", () => clanName === "WindClan");

        // ---------- Moving in 3D ----------
        const savedTrees = trees;
        check("R1", "cat walks forward", () => {
          trees = []; placeAt(0, -30); const z0 = player.z; const x0 = player.x;
          keys.KeyW = true; step(1); releaseAll();
          return player.z - z0 > 3 && Math.abs(player.x - x0) < 0.01;
        });
        check("R1", "A turns the cat left and D turns it right", () => {
          player.heading = 0;
          keys.KeyA = true; step(0.5); releaseAll();
          const left = player.heading;
          keys.KeyD = true; step(1); releaseAll();
          return left > 0.5 && player.heading < 0;
        });
        check("R1", "S walks backwards", () => {
          placeAt(0, -30); const z0 = player.z;
          keys.KeyS = true; step(0.5); releaseAll();
          return player.z < z0 - 0.5;
        });
        check("R1", "trees block walking", () => {
          const spot = at(0, -25);
          trees = [{ x: spot.x, z: spot.z, r: 0.6, h: 12, kind: "oak", phase: 0 }];
          placeAt(0, -30);
          player.heading = 0.4; // walk past the trunk at an angle so it can't be climbed
          keys.KeyW = true; step(2); releaseAll();
          return dist2d(player, trees[0]) >= trees[0].r + 0.39 || player.climbing !== null;
        });
        trees = savedTrees;

        check("R1", "cat can jump", () => {
          placeAt(0, -30); press("Space"); step(0.1);
          return player.y > 0;
        });
        check("R1", "cat lands again", () => { step(1.5); return player.y === 0 && player.onGround; });

        // ---------- R4 Task 1: squirrel ----------
        quiet();
        check("R4", "squirrel runs if you walk up loudly", () => {
          placeAt(0, 10);
          const s = at(0, 14);
          Object.assign(squirrel, { x: s.x, z: s.z, state: "idle", timer: 5 });
          step(0.1);
          return squirrel.state === "fleeing";
        });
        check("R4", "squirrel stays if you stalk", () => {
          placeAt(0, 10);
          const s = at(0, 11.9);
          Object.assign(squirrel, { x: s.x, z: s.z, state: "idle", timer: 5 });
          keys.ShiftLeft = true;
          step(0.1);
          return squirrel.state === "idle";
        });
        check("R4", "pounce catches squirrel -> level 2", () => { pressE(); releaseAll(); return stage === 1; });
        check("R4", "cat grew", () => STAGES[stage].size > STAGES[0].size);

        // ---------- R4 Task 2: fishing ----------
        check("R4", "can't fish away from the river", () => { quiet(); placeAt(-8, -14); pressE(); return fishing.active === false; });
        check("R4", "fishing starts at the river", () => { quiet(); place(bankX(), CAMP.z); pressE(); return fishing.active === true; });
        check("R4", "missing the zone does not count", () => {
          fishing.marker = fishing.zone > 0.5 ? 0 : 1; fishing.dir = 0; pressE();
          return fishing.catches === 0;
        });
        check("R4", "3 catches -> apprentice", () => {
          for (let i = 0; i < 3; i++) { fishing.dir = 0; fishing.marker = fishing.zone; pressE(); }
          return stage === 2 && fullName() === "Stormpaw" && !fishing.active && rankName() === "Apprentice";
        });

        // ---------- R19 mentor ----------
        check("R19", "a new apprentice chooses between 3 mentors", () => {
          const box = doc.getElementById("mentor-choice");
          const ids = [...doc.querySelectorAll("#mentor-options button")].map((b) => b.dataset.mentor);
          return choosingMentor === true && !box.classList.contains("hidden") && ids.join() === "hunter,fighter,herbs";
        });
        check("R19", "mentor buttons name the mentors and what they teach", () => {
          const text = doc.getElementById("mentor-options").textContent;
          return MENTORS.every((m) => text.includes(m.name)) && /hunt/i.test(text) && /fight/i.test(text) && /herb/i.test(text);
        });
        check("R19", "the game waits while choosing a mentor", () => {
          const z = player.z; keys.KeyW = true; step(0.5); releaseAll();
          return player.z === z;
        });
        check("R19", "choosing Briarfang makes the fighter your mentor", () => {
          doc.querySelector("#mentor-options button[data-mentor='fighter']").click();
          return mentor === "fighter" && !choosingMentor && doc.getElementById("mentor-choice").classList.contains("hidden");
        });
        check("R19", "your mentor follows you while you are an apprentice", () => {
          placeAt(-15, 25); step(8);
          const m = campCats.find((c) => c.mentorId === "fighter");
          return dist2d(m, player) < 4;
        });

        // ---------- R4 Task 3: rogue ----------
        check("R4", "rogue starts a fight", () => {
          place(ROGUE_HOME.x, ROGUE_HOME.z - 10); step(0.1);
          return rogue.state === "fighting";
        });
        check("R4", "losing resets the fight (the cat faints but keeps its progress)", () => {
          player.hp = 10; step(4);
          return player.hp === 100 && rogue.state === "waiting" && stage === 2;
        });
        check("R4", "beating the rogue -> choose a role", () => {
          place(ROGUE_HOME.x, ROGUE_HOME.z - 10); step(0.1);
          let swipes = 0;
          while (stage === 2 && swipes < 40) {
            Object.assign(rogue, { x: player.x, z: player.z + 1.2 });
            player.heading = 0; player.hp = 100;
            pressE(); step(0.45);
            swipes++;
          }
          return stage === 3 && choosingRole === true;
        });

        // ================= Round 1 =================
        // ---------- R9 roles ----------
        check("R9", "role choice shows Warrior, Deputy and Medicine cat", () => {
          const box = doc.getElementById("role-choice");
          const labels = [...doc.querySelectorAll("#role-options button")].map((b) => b.dataset.role);
          return !box.classList.contains("hidden") && labels.join() === "Warrior,Deputy,Medicine cat";
        });
        check("R9", "the game waits while choosing", () => {
          const x = player.x; keys.KeyW = true; step(0.5); releaseAll();
          return player.x === x;
        });
        check("R5", "choosing Warrior -> warrior with a warrior name", () => {
          doc.querySelector("#role-options button[data-role='Warrior']").click();
          return rankName() === "Warrior" && !choosingRole && WARRIOR_SUFFIXES.includes(warriorSuffix) &&
            fullName() === "Storm" + warriorSuffix && doc.getElementById("role-choice").classList.contains("hidden");
        });
        check("R19", "after choosing a role the mentor goes back to camp", () => {
          step(20);
          const m = campCats.find((c) => c.mentorId === "fighter");
          return dist2d(m, CAMP) < 9;
        });
        check("R4", "rogue runs away", () => rogue.state === "gone" || (step(5), rogue.state === "gone"));
        check("R9", "a new rogue appears some time after the last one is chased off", () => {
          step(ROGUE_RESPAWN + 1);
          return rogue.state === "waiting" && rogue.hp === ROGUE_HP;
        });
        check("R9", "winning fights after choosing a role is counted", () => {
          const before = stats.fights;
          place(rogue.x, rogue.z - 10); step(0.1);
          let swipes = 0;
          while (rogue.state === "fighting" && swipes < 40) {
            Object.assign(rogue, { x: player.x, z: player.z + 1.2 });
            player.heading = 0; player.hp = 100;
            pressE(); step(0.45);
            swipes++;
          }
          return stats.fights === before + 1;
        });
        check("R9", "catching prey after choosing a role is counted", () => {
          const before = stats.hunts;
          quiet(); placeAt(0, 10);
          const s = at(0, 11.5);
          Object.assign(squirrel, { x: s.x, z: s.z, state: "idle", timer: 5 });
          keys.ShiftLeft = true; step(1 / 60); pressE(); releaseAll();
          return stats.hunts === before + 1;
        });
        check("R9", "a warrior with 5 prey and 3 fights becomes Leader, name ends in -star", () => {
          stats.hunts = 4; stats.fights = 3;
          quiet(); placeAt(0, 10);
          const s = at(0, 11.5);
          Object.assign(squirrel, { x: s.x, z: s.z, state: "idle", timer: 5 });
          keys.ShiftLeft = true; step(1 / 60); pressE(); releaseAll();
          return role === "Leader" && rankName() === "Leader" && fullName() === "Stormstar";
        });
        check("R9", "a leader has 3 clanmates", () => clanmates.length === 3);
        check("R9", "order 1 (Follow): clanmates come to the leader", () => {
          placeAt(-20, 20); press("Digit1"); step(8);
          return order === "follow" && clanmates.every((c) => dist2d(c, player) < 5);
        });
        check("R9", "order 2 (Hunt): clanmates bring fresh-kill that refills food", () => {
          press("Digit2");
          player.food = 20; step(25);
          return order === "hunt" && player.food > 20;
        });
        check("R9", "order 3 (Guard): clanmates go back to camp", () => {
          press("Digit3"); step(20);
          return order === "guard" && clanmates.every((c) => dist2d(c, CAMP) < 6);
        });
        check("R9", "orders panel is shown to a leader", () => !doc.getElementById("orders").classList.contains("hidden"));
        check("R18", "with the herb pouch open, number keys don't give orders", () => {
          press("KeyH"); press("Digit1"); const o = order; press("KeyH");
          return o === "guard";
        });

        check("R9", "a deputy needs only 3 prey and 2 fights", () => {
          freshWithRole("Deputy");
          const okName = rankName() === "Deputy" && fullName() === catName + warriorSuffix;
          stats.hunts = 2; stats.fights = 2;
          placeAt(0, 10);
          const s = at(0, 11.5);
          Object.assign(squirrel, { x: s.x, z: s.z, state: "idle", timer: 5 });
          keys.ShiftLeft = true; step(1 / 60); pressE(); releaseAll();
          return okName && role === "Leader";
        });
        check("R9", "a medicine cat never becomes leader", () => {
          freshWithRole("Medicine cat");
          stats.hunts = 20; stats.fights = 20;
          placeAt(0, 10);
          const s = at(0, 11.5);
          Object.assign(squirrel, { x: s.x, z: s.z, state: "idle", timer: 5 });
          keys.ShiftLeft = true; step(1 / 60); pressE(); releaseAll();
          return role === "Medicine cat" && rankName() === "Medicine cat";
        });
        check("R9", "orders do nothing for a cat that is not leader", () => {
          freshWithRole("Warrior");
          press("Digit2");
          return clanmates.length === 0 && doc.getElementById("orders").classList.contains("hidden");
        });

        // ---------- R7 running ----------
        check("R7", "double-tapping forward makes the cat run", () => {
          walkFor("ThunderClan", 0.2, true);
          keys.KeyW = true; step(1 / 60);
          const running = player.running;
          releaseAll();
          return running === true;
        });
        check("R7", "a single tap and hold only walks", () => {
          step(0.5); // so the last tap of the previous check is long ago
          placeAt(0, -30); tap("KeyW"); step(0.5);
          const running = player.running;
          releaseAll();
          return running === false;
        });
        check("R7", "two slow taps (more than 0.3 s apart) do not run", () => {
          placeAt(0, -30); press("KeyW"); step(0.4); tap("KeyW"); step(0.1);
          const running = player.running;
          releaseAll();
          return running === false;
        });
        check("R7", "letting go of forward stops the run", () => {
          walkFor("ThunderClan", 0.2, true);
          step(0.1);
          return player.running === false;
        });
        check("R7", "running is faster than walking", () => walkFor("ThunderClan", 1, true) > walkFor("ThunderClan", 1, false) * 1.5);

        // ---------- R6 clan attributes ----------
        check("R6", "WindClan walks faster than ThunderClan", () => walkFor("WindClan", 1) > walkFor("ThunderClan", 1) + 0.5);
        check("R6", "WindClan runs faster than every other clan", () => {
          const wind = walkFor("WindClan", 1, true);
          return ["ThunderClan", "RiverClan", "ShadowClan"].every((c) => wind > walkFor(c, 1, true) + 0.5);
        });
        check("R6", "RiverClan swims faster than other clans", () => {
          const swim = (clan) => {
            clanName = clan; resetGame(); playing = true; quiet(); trees.length = 0;
            place(waterX(), CAMP.z - 20);
            keys.KeyW = true; step(1); releaseAll();
            return player.z - (CAMP.z - 20);
          };
          const river = swim("RiverClan");
          return ["ThunderClan", "WindClan", "ShadowClan"].every((c) => river > swim(c) + 0.5);
        });
        check("R6", "RiverClan has a bigger fishing zone", () => CLANS.RiverClan.fishZone > CLANS.ThunderClan.fishZone);
        check("R6", "every clan can climb a little", () =>
          ["RiverClan", "WindClan", "ShadowClan"].every((c) => climbFor(c, 3) > 0.5));
        check("R6", "ThunderClan climbs faster than other clans", () =>
          ["RiverClan", "WindClan", "ShadowClan"].every((c) => climbFor("ThunderClan", 0.5) > climbFor(c, 0.5) * 1.5));
        check("R6", "ThunderClan climbs much higher than other clans", () =>
          ["RiverClan", "WindClan", "ShadowClan"].every((c) => climbFor("ThunderClan", 6) > climbFor(c, 6) * 2));
        check("R6", "a climbing cat can climb down and jump off", () => {
          climbFor("ThunderClan", 1);
          const top = player.y;
          keys.KeyS = true; step(0.2); releaseAll();
          const lower = player.y < top && player.climbing !== null;
          press("Space"); step(2);
          return lower && player.climbing === null && player.y === 0;
        });
        check("R6", "ShadowClan's territory is a marshy pine forest", () => {
          const shadow = buildTrees().filter((t) => territoryAt(t.x, t.z) === "ShadowClan");
          clanName = "ShadowClan";
          return biome() === "marsh" && shadow.length > 20 && shadow.every((t) => t.kind === "pine");
        });
        check("R6", "other clans don't live in the marsh", () =>
          ["ThunderClan", "RiverClan", "WindClan"].every((c) => { clanName = c; return biome() !== "marsh"; }));
        check("R6", "ThunderClan prey notices you less and ShadowClan strikes harder (kept)", () =>
          CLANS.ThunderClan.stealth < CLANS.RiverClan.stealth && CLANS.ShadowClan.damage > CLANS.WindClan.damage);

        // ---------- R8 health and food ----------
        clanName = "ThunderClan";
        resetGame();
        playing = true;
        trees.length = 0;
        quiet();
        check("R8", "health and food bars are shown at the bottom of the screen", () => {
          updateHud();
          const bars = doc.getElementById("bars");
          const wrap = doc.getElementById("wrap").getBoundingClientRect();
          const box = bars.getBoundingClientRect();
          return !doc.getElementById("hud").classList.contains("hidden") &&
            doc.getElementById("health-bar") && doc.getElementById("food-bar") &&

          return pouchSize() === 8 && player.hp === 20 + HERBS.marigold.heal * 1.5;
        });
        check("R19", "without a herb-wise mentor the pouch holds 5", () => { freshApprentice("hunter"); return pouchSize() === 5; });

        // ---------- R18 herb pouch ----------
        freshWithRole("Warrior");
        check("R18", "any cat can pick herbs into its pouch", () => {
          const h = herbs[0]; h.ready = true;
          place(h.x, h.z - 1);
          pressE();
          return pouchCount() === 1 && player.pouch[h.kind] === 1 && h.ready === false;
        });
        check("R18", "kits can pick herbs too", () => {
          clanName = "ThunderClan"; resetGame(); playing = true; quiet();
          const h = herbs[0]; place(h.x, h.z - 1); pressE();
          return stage === 0 && pouchCount() === 1;
        });
        check("R18", "picked herbs grow back after 30 seconds", () => { step(HERB_REGROW + 1); return herbs[0].ready === true; });
        check("R18", "there are marigold and dock leaf patches in every territory", () =>
          Object.keys(CLANS).every((c) => herbs.some((h) => territoryAt(h.x, h.z) === c && h.kind === "marigold") &&
                                          herbs.some((h) => territoryAt(h.x, h.z) === c && h.kind === "dock")));
        check("R18", "the pouch is small: 5 herbs", () => {
          player.pouch = { marigold: 3, dock: 2 };
          const h = herbs[0]; h.ready = true; place(h.x, h.z - 1); pressE();
          return pouchCount() === 5 && h.ready === true;
        });
        check("R18", "H opens the pouch, which lists your herbs; H closes it", () => {
          press("KeyH");
          const el = doc.getElementById("pouch");
          const open = !el.classList.contains("hidden");
          const text = el.textContent;
          press("KeyH");
          return open && /marigold/i.test(text) && /dock/i.test(text) && text.includes("3") && text.includes("5") &&
            el.classList.contains("hidden");
        });
        check("R18", "with the pouch open, 1 uses a marigold to heal yourself", () => {
          player.hp = 40; press("KeyH"); press("Digit1");
          return player.hp === 40 + HERBS.marigold.heal && player.pouch.marigold === 2;
        });
        check("R18", "with the pouch open, 2 uses a dock leaf", () => {
          player.hp = 40; press("Digit2");
          return player.hp === 40 + HERBS.dock.heal && player.pouch.dock === 1;
        });
        check("R18", "pouch buttons can be clicked too", () => {
          player.hp = 40;
          doc.querySelector("#pouch-list button[data-herb='marigold']").click();
          return player.hp === 40 + HERBS.marigold.heal && player.pouch.marigold === 1;
        });
        check("R18", "herbs aren't wasted at full health", () => {
          player.hp = 100; press("Digit1"); press("KeyH");
          return player.pouch.marigold === 1;
        });
        check("R18", "camp cats sometimes get hurt", () => {
          campCats.forEach((c) => { c.injured = false; });
          step(INJURY_TIME + 1);
          return campCats.some((c) => c.injured);
        });
        check("R18", "only a medicine cat can heal an injured clanmate", () => {
          const hurt = campCats.find((c) => c.injured);
          player.pouch = { marigold: 1, dock: 0 };
          place(hurt.x, hurt.z - 1.2); pressE();
          return hurt.injured === true && player.pouch.marigold === 1;
        });
        check("R18", "a medicine cat heals an injured clanmate with a herb from the pouch", () => {
          freshWithRole("Medicine cat");
          const hurt = campCats[0];
          Object.assign(hurt, { injured: true, hp: 40, x: CAMP.x + 3, z: CAMP.z - 3, timer: 99 });
          player.pouch = { marigold: 0, dock: 1 };
          place(hurt.x, hurt.z - 1.2); pressE();
          return hurt.injured === false && hurt.hp === 100 && player.pouch.dock === 0;
        });

        // ---------- R20 homebase ----------
        freshWithRole("Warrior");
        check("R20", "the camp has a nursery, apprentices', warriors', medicine and leader's dens and a fresh-kill pile", () => {
          const ids = dens.map((d) => d.id).sort().join();
          return ids === "apprentices,leader,medicine,nursery,warriors" && freshKill === 3 &&
            dens.every((d) => dist2d(d, CAMP) < 9);
        });
        check("R20", "each rank has its own den", () => {
          const denFor = (s, r) => { stage = s; role = r; return myDen().id; };
          const ok = denFor(0, null) === "nursery" && denFor(2, null) === "apprentices" && denFor(3, "Warrior") === "warriors" &&
            denFor(3, "Deputy") === "warriors" && denFor(3, "Medicine cat") === "medicine" && denFor(3, "Leader") === "leader";
          stage = 3; role = "Warrior";
          return ok;
        });
        const goToDen = (id) => { const d = dens.find((x) => x.id === id); place(d.x, d.z); };
        check("R20", "resting in your den heals you and skips to the next morning", () => {
          dayTime = 0.6 * DAY_LENGTH; day = 1; player.hp = 30;
          goToDen("warriors"); pressE();
          return player.hp === 100 && day === 2 && clockText() === "07:12";
        });
        check("R20", "resting before 07:12 wakes you the same day", () => {
          dayTime = 0.1 * DAY_LENGTH; day = 3; player.hp = 30;
          goToDen("warriors"); pressE();
          return player.hp === 100 && day === 3 && clockText() === "07:12";
        });
        check("R20", "another rank's den tells you which den is yours", () => {
          dayTime = 0.6 * DAY_LENGTH; day = 1; player.hp = 30;
          goToDen("nursery"); pressE();
          return player.hp === 30 && day === 1 && /warriors' den/i.test(lastMessage);
        });
        check("R20", "you can't rest while an enemy is fighting you", () => {
          goToDen("warriors");
          Object.assign(rogue, { x: player.x + 5, z: player.z, state: "fighting", cooldown: 99 });
          pressE();
          rogue.state = "gone";
          return player.hp === 30;
        });
        check("R20", "carried prey can be dropped on the fresh-kill pile", () => {
          player.carrying = "mouse";
          place(FRESH_KILL.x, FRESH_KILL.z); pressE();
          return player.carrying === null && freshKill === 4;
        });
        check("R20", "a hungry cat eats from the fresh-kill pile", () => {
          player.food = 40; pressE();
          return player.food === 40 + PREY_FOOD.pile && freshKill === 3;
        });
        check("R20", "a cat that isn't hungry leaves the pile alone", () => {
          player.food = 100; pressE();
          return freshKill === 3;
        });

        // ---------- Drawing (3D) ----------
        resetGame(); playing = true; stage = 3; role = "Warrior";
        check("R11", "the 3D view uses the behind-the-cat camera", () => {
          placeAt(5, 5); player.heading = 2; snapCamera();
          renderFrame();
          const cam = cameraFor();
          return Math.abs(view.camera.position.x - cam.x) < 0.001 && Math.abs(view.camera.position.z - cam.z) < 0.001;
        });
        check("R1", "every level draws without errors", () => {
          for (const s of [0, 1, 2, 3]) { stage = s; renderFrame(); }
          fishing.active = true; renderFrame(); fishing.active = false;
          return true;
        });
        check("R6", "every clan's world draws without errors", () => {
          for (const c of Object.keys(CLANS)) { clanName = c; resetGame(); playing = true; buildScene(); renderFrame(); }
          return true;
        });
        check("R20", "the camp's dens and fresh-kill pile are drawn", () => view.denModels.length === 5 && view.pileModel.visible);
        check("R16", "camp cats and patrol cats are drawn", () =>
          view.campCatModels.length === campCats.length && view.patrolModels.length === patrols.length);
        check("R10", "the sky is darker at night than at noon", () => {
          const sky = (f) => { dayTime = f * DAY_LENGTH; renderFrame(); const c = view.scene.background; return c.r + c.g + c.b; };
          return sky(0.5) > sky(0) * 2;
        });

        // ---------- New cat ----------
        check("R1", "New cat goes back to the menu", () => {
          doc.getElementById("new-cat").click();
          return !playing && !doc.getElementById("menu").classList.contains("hidden");
        });
      } catch (e) {
        check("--", "tests ran without crashing: " + e.message, () => false);
      }

      const failed = results.filter((r) => !r.ok).length;
      document.getElementById("summary").textContent =
        failed === 0 ? `ALL ${results.length} TESTS PASSED` : `${failed} OF ${results.length} TESTS FAILED`;
      document.getElementById("summary").className = failed === 0 ? "pass" : "fail";
      document.getElementById("results").innerHTML = results
        .map((r) => `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "PASS" : "FAIL"} - ${r.name}</li>`)
        .join("");
    });
  </script>
</body>
</html>
