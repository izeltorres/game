<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forest Clans - tests</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: monospace; background: #111; color: #eee; margin: 10px; align-items: flex-start; }
    #wrap { width: 960px; }
    .pass { color: #7ddc6a; }
    .fail { color: #ff6b5b; }
  </style>
</head>
<body>
  <!-- Open this file in a browser. It loads the game below and plays through it automatically.
       Each check starts with the requirement ID (from problem.md) that it tests. -->
  <h2 id="summary">Running tests...</h2>
  <ul id="results"></ul>

  <!-- Same game markup as index.html -->
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="hud" class="hidden">
      <div id="task"></div>
      <div id="clock"></div>
      <div id="territory"></div>
      <div id="lives" class="hidden"></div>
      <div id="orders" class="hidden"></div>
      <div id="scent" class="hidden"></div>
      <div id="rogue-bar" class="bar hidden"><div class="fill"></div><span>Enemy</span></div>
      <div id="bars">
        <div id="health-bar" class="bar"><div class="fill"></div><span>Health</span></div>
        <div id="food-bar" class="bar"><div class="fill"></div><span>Food</span></div>
      </div>
    </div>
    <div id="fishing" class="hidden">
      <p id="fishing-text"></p>
    </div>
    <div id="pouch" class="hidden">
      <h3>Herb pouch</h3>
      <p id="pouch-count"></p>
      <div id="pouch-list"></div>
    </div>
    <div id="map" class="hidden">
      <canvas id="map-canvas" width="360" height="360"></canvas>
      <ul id="map-legend"></ul>
    </div>
    <div id="mentor-choice" class="hidden">
      <h2>Choose your mentor</h2>
      <div id="mentor-options"></div>
    </div>
    <div id="role-choice" class="hidden">
      <h2>Choose your path</h2>
      <div id="role-options"></div>
    </div>
    <div id="main-menu" class="hidden">
      <h2 id="main-menu-title">Paused</h2>
      <button data-action="resume">Resume</button>
      <button data-action="restart">Restart</button>
      <button data-action="newcat">New cat</button>
    </div>
    <div id="message" class="hidden"></div>
    <div id="menu">
      <h1 id="game-title"></h1>
      <input id="name-input">
      <div id="fur-options"></div>
      <div id="eye-options"></div>
      <div id="pattern-options"></div>
      <div id="clan-options"></div>
      <canvas id="preview" width="260" height="200"></canvas>
      <p id="preview-name"></p>
      <button id="start-btn">Start</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
  <script src="render3d.js"></script>
  <script src="script.js"></script>

  <script>
    const results = [];

    // check("R7", "what is checked", () => true or false)
    function check(id, name, test) {
      let ok = false;
      let error = "";
      try { ok = !!test(); } catch (e) { error = " (error: " + e.message + ")"; }
      results.push({ name: `${id}: ${name}${error}`, ok });
    }

    // Run the game logic for some seconds (60 steps per second)
    function step(seconds) {
      for (let i = 0; i < Math.round(seconds * 60); i++) update(1 / 60);
    }
    function releaseAll() {
      for (const k in keys) keys[k] = false;
    }
    // Press a key for one frame and keep holding it until releaseAll()
    function tap(code) {
      pressed[code] = true;
      keys[code] = true;
      step(1 / 60);
    }
    // Press a key for one frame and let go
    function press(code) {
      tap(code);
      keys[code] = false;
    }
    function pressE() {
      press("KeyE");
    }
    function dist2d(a, b) {
      return Math.hypot(a.x - b.x, a.z - b.z);
    }
    // Put the player at (x, z) facing +z, standing still on the ground
    function place(x, z) {
      Object.assign(player, { x, z, y: 0, vy: 0, heading: 0, turnVel: 0, onGround: true, climbing: null,
                              running: false, dodgeTimer: 0, dodgeCooldown: 0, recover: 0, attackCooldown: 0,
                              biteCooldown: 0 });
    }
    // Positions measured from the player's own camp (always inside the player's territory)
    function at(dx, dz) {
      return { x: CAMP.x + dx, z: CAMP.z + dz };
    }
    function placeAt(dx, dz) {
      place(CAMP.x + dx, CAMP.z + dz);
    }
    // Remove small prey, the squirrel and trees so they can't get in the way of a check
    function quiet() {
      prey.length = 0;
      squirrel.state = "hidden";
      squirrel.respawn = 9999;
      trees.length = 0; // no trunk can push the cat around during a check
    }
    function addPrey(kind, spot) {
      const p = { kind, x: spot.x, z: spot.z, state: "idle", timer: 99, dirX: 0, dirZ: 1, hop: 0, respawn: 0, trail: [], slot: 0 };
      prey.push(p);
      return p;
    }
    // x of the water in the player's own territory: a spot in it, and a spot on its bank
    function waterX() {
      return CAMP.x > 0 ? (RIVER_X0 + RIVER_X1) / 2 : (STREAM_X0 + STREAM_X1) / 2;
    }
    function bankX() {
      return CAMP.x > 0 ? RIVER_X0 - 1 : STREAM_X0 - 1;
    }
    // A fresh game as an apprentice (no mentor unless given), free to leave camp
    function freshApprentice(mentorId, clan) {
      clanName = clan || "ThunderClan";
      resetGame();
      playing = true;
      stage = 1;
      quiet();
      if (mentorId) chooseMentor(mentorId);
    }
    // A fresh game that has reached the role choice
    function freshAtRoleChoice(clan) {
      clanName = clan || "ThunderClan";
      resetGame();
      playing = true;
      stage = 2;
      choosingRole = true;
      quiet();
    }
    // A fresh game with a role (Warrior or Medicine cat), optionally with a mentor; can be promoted
    function freshWithRole(r, clan, mentorId) {
      freshAtRoleChoice(clan);
      mentor = mentorId || null;
      chooseRole(r === "Deputy" || r === "Leader" ? "Warrior" : r);
      if (r === "Deputy" || r === "Leader") promote("Deputy");
      if (r === "Leader") promote("Leader");
    }
    // Walk forward for some seconds with a clan, from an open spot; returns the distance
    function walkFor(clan, seconds, run) {
      freshApprentice(null, clan);
      placeAt(0, -30);
      step(0.5); // so the last tap of an earlier check is long ago
      if (run) { press("KeyW"); step(0.05); tap("KeyW"); }
      keys.KeyW = true;
      const start = { x: player.x, z: player.z };
      step(seconds);
      releaseAll();
      return dist2d(player, start);
    }
    // Climb a test tree for some seconds; returns the height reached
    function climbFor(clan, seconds) {
      freshApprentice(null, clan);
      const spot = at(12, -30);
      trees.push({ x: spot.x, z: spot.z, r: 0.6, h: 12, kind: "oak", phase: 0 });
      place(spot.x, spot.z - 0.6 - 0.45);
      keys.KeyW = true;
      step(seconds);
      const height = player.y;
      releaseAll();
      return height;
    }
    // A test enemy that is fighting the player, standing right in front of it
    function enemyInFrontOfPlayer(gap) {
      Object.assign(rogue, { x: player.x, z: player.z + (gap || 1.2), hp: ROGUE_HP, state: "fighting",
                             windup: 0, cooldown: 5, stagger: 0 });
      return rogue;
    }
    // Stand still next to a fighting enemy and return how much health was lost
    function damageTakenNear(enemy, seconds) {
      const hp = player.hp;
      step(seconds);
      return hp - player.hp;
    }
    // Catch a mouse that sits right in front of the player (stalking so it doesn't run)
    function catchMouseHere() {
      const p = addPrey("mouse", { x: player.x + Math.sin(player.heading) * 1.4, z: player.z + Math.cos(player.heading) * 1.4 });
      keys.ShiftLeft = true; step(1 / 60); pressE(); releaseAll();
      return p;
    }
    // Start fishing at your own bank, then put a fish under the paw (or not) and swipe
    function startFishing() {
      place(bankX(), CAMP.z); pressE();
    }
    function fishUnderPaw() {
      const paw = pawSpot();
      fishing.fish[0].x = paw.x; fishing.fish[0].z = paw.z;
      fishing.fish.slice(1).forEach((f) => { f.z = paw.z + 8; });
    }
    function noFishUnderPaw() {
      const paw = pawSpot();
      fishing.fish.forEach((f) => { f.z = paw.z + 6; });
    }
    // Visit the 3 border markers (in order)
    function walkThePatrol() {
      for (const m of BORDER_MARKERS) { place(m.x, m.z); step(0.1); }
    }
    // A pixel on the map canvas, as [r, g, b]
    function mapPixel(x, z) {
      const p = mapToCanvas(x, z);
      return [...document.getElementById("map-canvas").getContext("2d").getImageData(Math.round(p.x), Math.round(p.y), 1, 1).data].slice(0, 3);
    }
    function colorClose(rgb, hex) {
      const n = parseInt(hex.slice(1), 16);
      const want = [n >> 16, (n >> 8) & 255, n & 255];
      return rgb.every((v, i) => Math.abs(v - want[i]) < 40);
    }

    window.addEventListener("load", () => {
      const doc = document;
      try {
        // ================= Menu (R1-R3, R21) =================
        check("R1", "menu shows 6 fur colours", () => doc.querySelectorAll("#fur-options button").length === 6);
        check("R1", "menu shows 4 eye colours", () => doc.querySelectorAll("#eye-options button").length === 4);
        check("R21", "menu shows 7 patterns", () => doc.querySelectorAll("#pattern-options button").length === 7);
        check("R2", "menu shows 4 clans", () => doc.querySelectorAll("#clan-options button").length === 4);
        check("R3", "name is cleaned", () => cleanName("fIRE 9") === "Fire" && cleanName("") === "Fire");

        // Choose Black, Tabby, WindClan, name "storm"
        doc.querySelector("#fur-options button[title='Black']").click();
        doc.querySelectorAll("#pattern-options button")[1].click();
        doc.querySelectorAll("#clan-options button")[2].click();
        doc.getElementById("name-input").value = "storm";
        doc.getElementById("start-btn").click();

        check("R1", "game starts", () => playing === true);
        check("R1", "menu hidden after start", () => doc.getElementById("menu").classList.contains("hidden"));
        check("R3", "starts as a kit called Stormkit", () => fullName() === "Stormkit" && rankName() === "Kit" && stage === 0);
        check("R1", "chosen look is used", () => look.fur === "#2e2b2b" && look.pattern === "Tabby");
        check("R2", "chosen clan is used", () => clanName === "WindClan");

        // ================= R42, R45, R41: the kit stage, in camp =================
        check("R42", "a kit can't walk out of camp", () => {
          placeAt(0, 0); player.heading = 0; // WindClan: straight ahead runs between the nursery and the apprentices' den
          keys.KeyW = true; step(4); releaseAll();
          return dist2d(player, CAMP) <= KIT_BOUNDARY + 0.01 && dist2d(player, CAMP) > KIT_BOUNDARY - 1 && /camp/i.test(lastMessage);
        });
        check("R42", "beetles and mice for kits scurry around inside the camp", () =>
          prey.length >= 8 && prey.every((p) => p.state === "hidden" || dist2d(p, CAMP) <= KIT_BOUNDARY));
        check("R42", "squirrels stay out of the kit's way", () => { step(1); return squirrel.state === "hidden"; });
        check("R45", "a kit needs 5 beetles and 3 mice", () => KIT_NEEDS.beetle === 5 && KIT_NEEDS.mouse === 3 &&
          kitCatches.beetle === 0 && kitCatches.mouse === 0);
        const kitSpot = () => { placeAt(0, -2); player.heading = 0; };
        check("R45", "each beetle a kit catches counts, and the kit grows", () => {
          prey.length = 0; kitSpot(); step(0.5);
          const size = catSize();
          addPrey("beetle", at(0, -0.8)); step(1 / 60); pressE();
          return kitCatches.beetle === 1 && catSize() > size;
        });
        check("R45", "each mouse counts too (stalk so it doesn't run)", () => {
          prey.length = 0; kitSpot();
          const size = catSize();
          catchMouseHere();
          return kitCatches.mouse === 1 && catSize() > size;
        });
        check("R45", "catches past what is needed don't count twice", () => {
          kitCatches.beetle = 5; prey.length = 0; kitSpot();
          addPrey("beetle", at(0, -0.8)); step(1 / 60); pressE();
          return kitCatches.beetle === 5 && stage === 0;
        });
        check("R45", "the kit grows from 0.5 to 0.75 with the mix", () => {
          const b = kitCatches.beetle, m = kitCatches.mouse;
          kitCatches.beetle = 0; kitCatches.mouse = 0; const small = catSize();
          kitCatches.beetle = 5; kitCatches.mouse = 3; const big = catSize();
          kitCatches.beetle = b; kitCatches.mouse = m;
          return Math.abs(small - 0.5) < 0.001 && Math.abs(big - 0.75) < 0.001;
        });
        check("R45", "the full mix makes the kit an apprentice", () => {
          kitCatches.beetle = 5; kitCatches.mouse = 2; prey.length = 0; kitSpot();
          catchMouseHere();
          return stage === 1 && rankName() === "Apprentice";
        });
        check("R41", "an apprentice's name ends in -paw", () => fullName() === "Stormpaw");

        // ---------- R19 mentor choice ----------
        check("R19", "a new apprentice chooses between 3 mentors", () => {
          const box = doc.getElementById("mentor-choice");
          const ids = [...doc.querySelectorAll("#mentor-options button")].map((b) => b.dataset.mentor);
          return choosingMentor === true && !box.classList.contains("hidden") && ids.join() === "hunter,fighter,herbs";
        });
        check("R19", "mentor buttons name the mentors and what they teach", () => {
          const text = doc.getElementById("mentor-options").textContent;
          return MENTORS.every((m) => text.includes(m.name)) && /hunt/i.test(text) && /fight/i.test(text) && /herb/i.test(text);
        });
        check("R19", "the game waits while choosing a mentor", () => {
          const z = player.z; keys.KeyW = true; step(0.5); releaseAll();
          return player.z === z;
        });
        check("R19", "choosing Briarfang makes the fighter your mentor", () => {
          doc.querySelector("#mentor-options button[data-mentor='fighter']").click();
          return mentor === "fighter" && !choosingMentor && doc.getElementById("mentor-choice").classList.contains("hidden");
        });

        // ================= R44, R45: the mentor's tasks =================
        const theMentor = () => campCats.find((c) => c.mentorId === mentor);
        check("R44", "the mentor gives the first task, a border patrol", () =>
          currentTask() === "patrol" && lastMessage.startsWith("Briarfang"));
        check("R44", "the HUD shows the task as the mentor's task", () => {
          updateHud();
          const text = doc.getElementById("task").textContent;
          return text.includes("Briarfang") && /task/i.test(text) && /patrol|marker/i.test(text);
        });
        check("R44", "the mentor leads you towards the task", () => {
          const m = BORDER_MARKERS[0];
          // stand 8 from the first marker, on the camp side
          const away = Math.atan2(CAMP.x - m.x, CAMP.z - m.z);
          place(m.x + Math.sin(away) * 8, m.z + Math.cos(away) * 8);
          Object.assign(theMentor(), { x: player.x, z: player.z - 1 });
          step(8);
          return dist2d(theMentor(), m) < 4 && dist2d(theMentor(), m) < dist2d(player, m) && dist2d(theMentor(), player) <= 11;
        });
        check("R44", "the mentor comes back for you if you fall behind", () => {
          placeAt(-15, 25);
          const before = dist2d(theMentor(), player);
          step(18); // the mentor starts by the far border marker
          return before > 11 && dist2d(theMentor(), player) < 11;
        });
        check("R44", "the rogue doesn't show up before the mentor's rogue task", () => {
          place(ROGUE_HOME.x, ROGUE_HOME.z - 5); step(0.5);
          return rogue.state !== "fighting";
        });
        check("R45", "border patrol: the 3 markers must be visited in order", () => {
          const [a, b, c] = BORDER_MARKERS;
          place(a.x, a.z); step(0.1);
          const one = markersVisited === 1;
          place(c.x, c.z); step(0.1);
          const stillOne = markersVisited === 1;
          place(b.x, b.z); step(0.1);
          return one && stillOne && markersVisited === 2 && BORDER_MARKERS.length === 3 &&
            BORDER_MARKERS.every((mk) => territoryAt(mk.x, mk.z) === clanName);
        });
        check("R45", "finishing the patrol moves on to the mentor's next task: hunt a squirrel", () => {
          const c = BORDER_MARKERS[2];
          place(c.x, c.z); step(0.1);
          return currentTask() === "squirrel" && lastMessage.startsWith("Briarfang");
        });

        // ---------- Moving in 3D (R1), as an apprentice outside camp ----------
        const savedTrees = trees;
        check("R1", "cat walks forward", () => {
          trees = []; placeAt(0, -30); const z0 = player.z; const x0 = player.x;
          keys.KeyW = true; step(1); releaseAll();
          return player.z - z0 > 3 && Math.abs(player.x - x0) < 0.01;
        });
        check("R1", "A turns the cat left and D turns it right", () => {
          player.heading = 0;
          keys.KeyA = true; step(0.5); releaseAll();
          const left = player.heading;
          keys.KeyD = true; step(1); releaseAll();
          return left > 0.5 && player.heading < 0;
        });
        check("R1", "S walks backwards", () => {
          placeAt(0, -30); const z0 = player.z;
          keys.KeyS = true; step(0.5); releaseAll();
          return player.z < z0 - 0.5;
        });
        check("R1", "trees block walking", () => {
          const spot = at(0, -25);
          trees = [{ x: spot.x, z: spot.z, r: 0.6, h: 12, kind: "oak", phase: 0 }];
          placeAt(0, -30);
          player.heading = 0.4;
          keys.KeyW = true; step(2); releaseAll();
          return dist2d(player, trees[0]) >= trees[0].r + 0.39 || player.climbing !== null;
        });
        trees = savedTrees;
        check("R1", "cat can jump", () => { placeAt(0, -30); press("Space"); step(0.1); return player.y > 0; });
        check("R1", "cat lands again", () => { step(1.5); return player.y === 0 && player.onGround; });

        // ---------- Task 2: hunt a squirrel (R4) ----------
        quiet();
        check("R4", "squirrel runs if you walk up loudly", () => {
          placeAt(0, -30);
          const s = at(0, -26);
          Object.assign(squirrel, { x: s.x, z: s.z, state: "idle", timer: 5 });
          step(0.1);
          return squirrel.state === "fleeing";
        });
        check("R4", "squirrel stays if you stalk", () => {
          placeAt(0, -30);
          const s = at(0, -28.1);
          Object.assign(squirrel, { x: s.x, z: s.z, state: "idle", timer: 5 });
          keys.ShiftLeft = true;
          step(0.1);
          return squirrel.state === "idle";
        });
        check("R4", "pouncing on the squirrel completes the task -> next: catch fish", () => {
          pressE(); releaseAll();
          return currentTask() === "fish" && lastMessage.startsWith("Briarfang");
        });

        // ---------- Task 3: catch fish (R4, R35) ----------
        check("R4", "can't fish away from the water", () => { quiet(); placeAt(-8, -24); pressE(); return fishing.active === false; });
        check("R35", "pressing E by the water starts fishing, facing the water", () => {
          quiet(); startFishing();
          const paw = pawSpot();
          return fishing.active === true && inRiver(paw.x);
        });
        check("R35", "fish swim about under the surface in the water", () => {
          const before = fishing.fish.map((f) => ({ x: f.x, z: f.z }));
          step(1);
          return fishing.fish.length >= 3 && fishing.fish.every((f) => inRiver(f.x)) &&
            fishing.fish.some((f, i) => dist2d(f, before[i]) > 0.1);
        });
        check("R35", "a swipe with no fish under the paw misses, splashes, and fish dart away", () => {
          noFishUnderPaw();
          const near = fishing.fish[0];
          near.x = pawSpot().x; near.z = pawSpot().z + 1.5; // close, but not under the paw
          pressE();
          return fishing.catches === 0 && fishing.flash > 0 && !fishing.flashGood && near.dart > 0;
        });
        check("R35", "a swipe with a fish under the paw catches it", () => {
          step(1.2); fishUnderPaw(); pressE();
          return fishing.catches === 1;
        });
        check("R4", "3 fish complete the task -> next: chase off the rogue", () => {
          for (let i = 0; i < 2; i++) { step(0.5); fishUnderPaw(); pressE(); }
          return currentTask() === "rogue" && !fishing.active && lastMessage.startsWith("Briarfang");
        });
        check("R35", "RiverClan's paw reaches further", () => pawReach("RiverClan") > pawReach("ThunderClan"));

        // ---------- Task 4: chase off a rogue (R4) ----------
        check("R4", "rogue starts a fight", () => {
          place(ROGUE_HOME.x, ROGUE_HOME.z - 10); step(0.1);
          return rogue.state === "fighting";
        });
        check("R4", "losing resets the fight (the cat faints but keeps its progress)", () => {
          player.hp = 10; step(4);
          return player.hp === 100 && rogue.state === "waiting" && stage === 1 && currentTask() === "rogue";
        });
        check("R45", "beating the rogue finishes the apprenticeship -> choose a path", () => {
          place(ROGUE_HOME.x, ROGUE_HOME.z - 10); step(0.1);
          let swipes = 0;
          while (stage === 1 && swipes < 40) {
            Object.assign(rogue, { x: player.x, z: player.z + 1.2 });
            player.heading = 0; player.hp = 100;
            pressE(); step(0.45);
            swipes++;
          }
          return stage === 2 && choosingRole === true;
        });

        // ================= R43, R40, R5, R9: choosing a path =================
        check("R43", "the only choices are Warrior and Medicine cat", () => {
          const box = doc.getElementById("role-choice");
          const labels = [...doc.querySelectorAll("#role-options button")].map((b) => b.dataset.role);
          return !box.classList.contains("hidden") && labels.join() === "Warrior,Medicine cat" && ROLES.join() === "Warrior,Medicine cat";
        });
        check("R9", "the game waits while choosing", () => {
          const x = player.x; keys.KeyW = true; step(0.5); releaseAll();
          return player.x === x;
        });
        check("R5", "choosing Warrior -> warrior with a warrior name", () => {
          doc.querySelector("#role-options button[data-role='Warrior']").click();
          return rankName() === "Warrior" && !choosingRole && WARRIOR_SUFFIXES.includes(warriorSuffix) &&
            fullName() === "Storm" + warriorSuffix && doc.getElementById("role-choice").classList.contains("hidden");
        });
        check("R40", "the clan leader gives the warrior name in a ceremony", () =>
          /leader/i.test(lastMessage) && lastMessage.includes(fullName()));
        check("R19", "after choosing a role the mentor goes back to camp", () => {
          step(20);
          return dist2d(theMentor(), CAMP) < 9;
        });
        check("R4", "rogue runs away", () => rogue.state === "gone" || (step(5), rogue.state === "gone"));
        check("R9", "a new rogue appears some time after the last one is chased off", () => {
          step(ROGUE_RESPAWN + 1);
          return rogue.state === "waiting" && rogue.hp === ROGUE_HP;
        });
        check("R9", "winning fights after choosing a role is counted", () => {
          const before = stats.fights;
          place(rogue.x, rogue.z - 10); step(0.1);
          let swipes = 0;
          while (rogue.state === "fighting" && swipes < 40) {
            Object.assign(rogue, { x: player.x, z: player.z + 1.2 });
            player.heading = 0; player.hp = 100;

          for (const c of Object.keys(CLANS)) { clanName = c; resetGame(); playing = true; buildScene(); renderFrame(); }
          return true;
        });
        check("R30", "every kind of weather draws without errors", () => { for (const w of WEATHERS) { setWeather(w); renderFrame(); } setWeather("clear"); return true; });
        check("R20", "the camp's dens and fresh-kill pile are drawn", () => view.denModels.length === 5 && view.pileModel.visible);
        check("R16", "camp cats and patrol cats are drawn", () => view.campCatModels.length === campCats.length && view.patrolModels.length === patrols.length);
        check("R10", "the sky is darker at night than at noon", () => {
          const sky = (f) => { dayTime = f * DAY_LENGTH; renderFrame(); const c = view.scene.background; return c.r + c.g + c.b; };
          return sky(0.5) > sky(0) * 2;
        });

        // ================= New cat (R26) =================
        check("R26", "New cat in the main menu goes back to the cat maker", () => {
          playing = true; ui.menu = false;
          press("Escape");
          doc.querySelector("#main-menu button[data-action='newcat']").click();
          return !playing && !ui.menu && !doc.getElementById("menu").classList.contains("hidden");
        });
      } catch (e) {
        check("--", "tests ran without crashing: " + e.message, () => false);
      }

      const failed = results.filter((r) => !r.ok).length;
      document.getElementById("summary").textContent =
        failed === 0 ? `ALL ${results.length} TESTS PASSED` : `${failed} OF ${results.length} TESTS FAILED`;
      document.getElementById("summary").className = failed === 0 ? "pass" : "fail";
      document.getElementById("results").innerHTML = results
        .map((r) => `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "PASS" : "FAIL"} - ${r.name}</li>`)
        .join("");
    });
  </script>
</body>
</html>
